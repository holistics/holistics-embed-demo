# Netlify deploy config for the ShelfOptix embed demo.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Map the app's /api/* calls to Netlify Functions (order matters: specific first).
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/embed-token"
  to = "/.netlify/functions/embed-token"
  status = 200

# SPA fallback for client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
